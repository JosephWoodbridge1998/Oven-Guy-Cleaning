name: Import original work photos
on:
  push:
    branches: [main]
    paths: ['scripts/import_work_photos.py', '.github/workflows/import-work-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-work-photos
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install 'Pillow>=11,<13'
      - name: Download and validate originals, then assemble gallery
        run: python scripts/import_work_photos.py
      - name: Commit validated gallery to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work index.html README.md CONTENT_AUDIT.csv IMAGE_IMPORT_RESULTS.json
          if git diff --cached --quiet; then
            echo 'Gallery already up to date'
          else
            git commit -m 'feat: integrate original oven-door work photos'
            git push origin HEAD:main
          fi
