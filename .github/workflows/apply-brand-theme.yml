name: Apply original brand theme
on:
  push:
    branches: [main]
    paths: ['theme.css', 'scripts/apply_brand_theme.py', 'scripts/test_brand_theme.py', '.github/workflows/apply-brand-theme.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-brand-theme
  cancel-in-progress: false
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the theme link and illustration
        run: python scripts/apply_brand_theme.py
      - name: Install browser checks
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Check mobile and desktop rendering
        run: python scripts/test_brand_theme.py
      - name: Save checked previews
        uses: actions/upload-artifact@v4
        with:
          name: brand-theme-previews
          path: /tmp/brand-theme-checks
      - name: Commit tested homepage theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html THEME_TEST_RESULTS.json
          if git diff --cached --quiet; then
            echo 'Theme already applied'
          else
            git commit -m 'style: apply tested charcoal and red theme to homepage'
            git push origin HEAD:main
          fi
